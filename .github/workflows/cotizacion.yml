name: Cotización ARS (BCU)

# Consulta el servicio web oficial del BCU dos veces por día y publica cotizacion-ars.json.
# 13:30 UTC = 10:30 Montevideo (cotización del día hábil anterior)
# 22:30 UTC = 19:30 Montevideo (cierre del día)
on:
  schedule:
    - cron: '30 13 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cotizacion-ars
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Pruebas del actualizador (sin red)
        run: node test/test.mjs

      - name: Consultar BCU y actualizar cotizacion-ars.json
        id: bcu
        continue-on-error: true
        run: node scripts/actualizar-cotizacion.mjs

      - name: 'Guardar el JSON (también si falló: conserva la última cotización válida y registra el error)'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cotizacion-ars.json
          if git diff --cached --quiet; then
            echo "Sin cambios en cotizacion-ars.json"
          else
            git commit -m "Cotización ARS — $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - name: Marcar la ejecución como fallida si el BCU no respondió bien
        if: steps.bcu.outcome == 'failure'
        run: |
          echo "::error::No se pudo actualizar la cotización. Se conserva la última válida. Ver el campo estado en cotizacion-ars.json."
          exit 1
